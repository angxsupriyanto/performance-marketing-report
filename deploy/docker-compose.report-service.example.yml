# Example. Run it as its own Compose project next to n8n so the existing stack is never recreated:
#   cp docker-compose.report-service.example.yml docker-compose.report-service.local.yml
#   (change only the network name below to the one n8n already uses)
#   docker compose -p report-service -f docker-compose.report-service.local.yml up -d --build
# Do not publish a port: n8n reaches the service by name over the shared network.
# Create the secret out of band (never commit it):  openssl rand -hex 32 > report_service_token.txt
services:
  report-service:
    container_name: report-service   # fixed name so deploy/verify-report-service.sh can find it
    build:
      context: ..
      args:
        REPORT_GENERATOR_VERSION: "${REPORT_GENERATOR_VERSION:-dev}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      REPORT_SERVICE_TOKEN_FILE: /run/secrets/report_service_token
    secrets:
      - report_service_token
    networks:
      - n8n_internal            # replace with the network n8n already uses

secrets:
  report_service_token:
    file: ./report_service_token.txt

networks:
  n8n_internal:
    external: true
